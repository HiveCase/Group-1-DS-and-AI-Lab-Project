name: Build and push to GHCR registry

# Builds the same production image as deploy-gke.yml (root Dockerfile:
# frontend baked in, served by FastAPI on one port) and publishes it to
# GitHub Container Registry instead of GCP Artifact Registry -- no GCP
# project, GKE cluster, or cloud secrets required. GITHUB_TOKEN (provided
# automatically by Actions) is enough to push. This does NOT deploy the
# image anywhere by itself -- GitHub Actions runners don't stay up after
# the job finishes -- it just publishes a versioned image you pull and run
# wherever you host it (see scripts/deploy-local.ps1 for the equivalent
# build-and-run flow on your own machine).

on:
  push:
    branches:
      - car-damage-claim-fulstack-developement
  pull_request:
    branches:
      - car-damage-claim-fulstack-developement
  workflow_dispatch:

env:
  # GHCR requires a lowercase image ref; github.repository preserves the
  # repo's actual case (HiveCase/Group-1-...), so it's lowercased below.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test (CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build, scan, and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: |
          uri="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "uri=${uri}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest=${uri}:latest" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${{ steps.image.outputs.uri }}" -t "${{ steps.image.outputs.latest }}" .

      # - name: Scan image for vulnerabilities
      #   # Pinned by commit SHA, not a mutable tag: this action had a
      #   # credential-stealer injected via tag hijacking in March 2026,
      #   # affecting every tag from 0.0.1 through 0.34.2 (that includes the
      #   # 0.24.0 this workflow used to reference). SHA pin = v0.36.0,
      #   # the current release as of this writing -- confirm no newer
      #   # advisory exists before bumping.
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      #   with:
      #     image-ref: ${{ steps.image.outputs.uri }}
      #     format: table
      #     severity: CRITICAL,HIGH
      #     exit-code: "1"
      #     ignore-unfixed: true

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.latest }}"

      - name: Print pull/run instructions
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`\`\`"
            echo "docker pull ${{ steps.image.outputs.uri }}"
            echo "docker run -d --name claims-portal -p 8000:8000 \\"
            echo "  -v claims-portal-data:/data \\"
            echo "  -e GROQ_API_KEY=... -e MODEL_NAME=... \\"
            echo "  ${{ steps.image.outputs.uri }}"
            echo "\`\`\`"
            echo ""
            echo "First push: the package defaults to **private** under"
            echo "github.com/${{ github.repository_owner }}?tab=packages --"
            echo "either make it public there, or \`docker login ghcr.io\`"
            echo "with a PAT that has \`read:packages\` before pulling."
          } >> "${GITHUB_STEP_SUMMARY}"
