services:
  - type: web
    name: ds-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # ── CORS: allow the Vercel frontend origin ──
      # Update this after your first Vercel deploy with the actual URL
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      # ── Database & storage ──
      - key: DATABASE_URL
        value: "sqlite:////data/claims.db"
      - key: UPLOAD_DIR
        value: "/data/uploads"
      - key: MODEL_DIR
        value: "/data/models"
      - key: DATA_DIR
        value: "/data/data"
      - key: CHROMA_PERSIST_DIR
        value: "/data/chroma"
      # ── Secrets (set these in Render dashboard, not here) ──
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # set manually in Render dashboard
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
    disk:
      name: ds-ai-data
      mountPath: /data
      sizeGB: 1
